<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>EARNOVA Admin Panel</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{color-scheme:dark;--bg:#0b1220;--panel:#121d30;--panel2:#18263d;--line:#293a55;--txt:#edf3ff;--muted:#9aabc4;--blue:#4e8cff;--green:#25c58a;--red:#f16b75;--yellow:#f2bd55}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px system-ui,-apple-system,Segoe UI,sans-serif}
    header{padding:18px 16px;background:#101a2b;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
    header h1{margin:0;font-size:21px}header p{margin:5px 0 0;color:var(--muted);font-size:12px}
    main{max-width:1100px;margin:auto;padding:14px}
    .notice{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:14px;color:var(--muted);line-height:1.5}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
    button,.tab{border:1px solid var(--line);background:var(--panel2);color:var(--txt);padding:10px 13px;border-radius:9px;font-weight:600;cursor:pointer}
    button.primary{background:var(--blue);border-color:var(--blue);color:white}button.good{background:#126b50;border-color:#126b50}button.danger{background:#762f3a;border-color:#762f3a}
    button:disabled{opacity:.5;cursor:not-allowed}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:10px;margin-bottom:12px}.tab.active{background:var(--blue);border-color:var(--blue)}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px}
    .stat small{color:var(--muted)}.stat strong{display:block;font-size:22px;margin-top:7px;overflow-wrap:anywhere}
    .section-title{font-size:17px;margin:8px 0 12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
    .muted{color:var(--muted)}.hidden{display:none!important}.stack{display:grid;gap:10px}.item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px}
    .item h3{font-size:15px;margin:0 0 7px}.item p{margin:5px 0;color:var(--muted);overflow-wrap:anywhere}
    .actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.actions button{padding:8px 10px;font-size:12px}
    input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:#0d1728;color:var(--txt);font:inherit}
    textarea{min-height:75px;resize:vertical}label{display:block;color:var(--muted);font-size:12px;margin:10px 0 5px}
    .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}.form-actions{margin-top:12px}
    .pill{display:inline-block;border-radius:20px;padding:3px 8px;background:#263852;color:#cfe0ff;font-size:11px}
    .pill.pending{background:#59451e;color:#ffe0a0}.pill.approved,.pill.completed{background:#124b3b;color:#a7f3d0}.pill.rejected{background:#592b35;color:#ffc0c5}
    .withdrawal-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0 16px}
    .withdrawal-stat{background:linear-gradient(145deg,#17263e,#111d30);border:1px solid var(--line);border-radius:14px;padding:13px}
    .withdrawal-stat small{display:block;color:var(--muted);font-size:11px}.withdrawal-stat strong{display:block;font-size:23px;margin-top:5px}
    .withdrawal-tools{display:grid;grid-template-columns:minmax(0,1fr) minmax(130px,190px);gap:8px;margin:12px 0 14px}
    .withdrawal-card{background:linear-gradient(145deg,#17263e,#111b2d);border:1px solid #30425f;border-radius:15px;padding:15px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
    .withdrawal-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
    .withdrawal-id{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em}.withdrawal-amount{font-size:25px;font-weight:800;margin-top:4px;color:#f5f8ff}
    .withdrawal-details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px;padding:14px 0}
    .withdrawal-field{min-width:0}.withdrawal-field small{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.withdrawal-field strong{display:block;font-size:13px;overflow-wrap:anywhere;line-height:1.45}
    .withdrawal-field.full{grid-column:1/-1}.upi-line{display:flex;align-items:center;gap:8px}.upi-line strong{flex:1}.copy-upi{padding:6px 9px;font-size:11px;white-space:nowrap}
    .withdrawal-foot{border-top:1px solid var(--line);padding-top:11px;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
    .timezone-note{font-size:11px;color:var(--muted);margin:0 0 10px}
    @media(max-width:420px){.withdrawal-summary{gap:6px}.withdrawal-stat{padding:10px}.withdrawal-stat strong{font-size:19px}.withdrawal-details{grid-template-columns:1fr 1fr}.withdrawal-tools{grid-template-columns:1fr}}
    /* EARNOVA User Management redesign */
    .user-search{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px;margin:12px 0 16px}
    .user-results{display:grid;gap:9px}.user-result{display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(145deg,#19102f,#111827);border:1px solid #493078;border-radius:15px;padding:14px}
    .user-result strong{display:block;font-size:15px}.user-result small{display:block;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
    .user-hero{background:linear-gradient(130deg,#1b1034,#111b31);border:1px solid #51318a;border-radius:18px;padding:16px;margin:12px 0}
    .user-hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}.user-name{font-size:21px;font-weight:800}.user-handle{color:#c2b0e8;margin-top:3px}.user-meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
    .user-meta div{min-width:0}.user-meta small,.user-stat small{display:block;color:var(--muted);font-size:11px}.user-meta strong{display:block;font-size:12px;margin-top:4px;overflow-wrap:anywhere}
    .user-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:12px 0}.user-stat{background:linear-gradient(145deg,#17112a,#121d30);border:1px solid #3c2b64;border-radius:14px;padding:12px;min-width:0}.user-stat strong{display:block;font-size:20px;margin-top:7px;overflow-wrap:anywhere}
    .user-panels{display:grid;grid-template-columns:1.2fr 1fr;gap:10px;margin:12px 0}.user-panel{background:linear-gradient(145deg,#17112a,#111b2c);border:1px solid #3d2a66;border-radius:15px;padding:14px;min-width:0}.user-panel h3{margin:0 0 12px;font-size:15px}.user-activity{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:9px;align-items:center;padding:9px 0;border-bottom:1px solid #2b2440;font-size:12px}.user-activity:last-child{border-bottom:0}.user-activity span:first-child{overflow-wrap:anywhere}.user-activity time{color:var(--muted);font-size:11px}.user-positive{color:#39d98a;font-weight:700}.user-risk{border-color:#3b465d}.user-history{display:grid;gap:8px}.user-history-row{background:#111b2b;border:1px solid #293a55;border-radius:11px;padding:11px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;font-size:12px}.user-history-row p{margin:4px 0 0;color:var(--muted);overflow-wrap:anywhere}.user-section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 0 10px}.user-section-head h3{margin:0;font-size:16px}
    @media(max-width:620px){.user-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.user-panels{grid-template-columns:1fr}.user-meta{grid-template-columns:1fr 1fr}.user-activity{grid-template-columns:minmax(0,1fr) auto}.user-activity time{grid-column:1/-1}.user-search{grid-template-columns:1fr}}
    #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#243650;padding:11px 16px;border-radius:10px;max-width:90%;z-index:20;display:none}
    .empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
    .danger-text{color:#ff9aa2}.small{font-size:12px}
    @media(min-width:700px){main{padding:22px}header{padding-left:max(18px,calc((100% - 1060px)/2))}}
  </style>
</head>
<body>
<header><h1>⚡ EARNOVA Admin</h1><p>Secure control panel · Telegram Admin only</p></header>
<main>
  <div class="notice" id="statusBox">Telegram Mini App authentication verify हो रही है…</div>
  <section id="setup" class="card hidden">
    <h2 class="section-title">Backend URL सेट करें</h2>
    <p class="muted">अपना Render Flask backend URL डालें। उदाहरण: https://your-service.onrender.com</p>
    <label>Flask Backend URL</label><input id="apiBaseInput" placeholder="https://your-backend.onrender.com">
    <div class="form-actions"><button class="primary" onclick="saveApiBase()">Save & Reload</button></div>
  </section>
  <section id="app" class="hidden">
    <div class="toolbar"><button class="primary" onclick="loadSection('dashboard')">↻ Refresh</button><button onclick="changeApi()">Backend URL</button><span class="muted small" id="adminIdentity"></span></div>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="dashboard" onclick="loadSection('dashboard')">Dashboard</button>
      <button class="tab" data-tab="withdrawals" onclick="loadSection('withdrawals')">Withdrawals</button>
      <button class="tab" data-tab="users" onclick="loadSection('users')">Users</button>
      <button class="tab" data-tab="tasks" onclick="loadSection('tasks')">Tasks</button>
      <button class="tab" data-tab="submissions" onclick="loadSection('submissions')">Task Reviews</button>
      <button class="tab" data-tab="bonuses" onclick="loadSection('bonuses')">Bonus Codes</button>
      <button class="tab" data-tab="referrals" onclick="loadSection('referrals')">Referrals</button>
    </nav>
    <div id="content"></div>
  </section>
</main>
<div id="toast"></div>
<script>
(() => {
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }
  const ADMIN_ID = 7691713278;
  let API_BASE = (localStorage.getItem('earnova_admin_api') || 'https://earnova-miniapp.onrender.com').replace(/\/+$/,'');
  let current = 'dashboard';
  const initData = tg?.initData || '';
  const $ = id => document.getElementById(id);
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function toast(msg){$('toast').textContent=msg;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3200)}
  function status(msg,bad=false){$('statusBox').textContent=msg;$('statusBox').style.color=bad?'#ff9aa2':'#9aabc4'}
  window.saveApiBase=()=>{const v=$('apiBaseInput').value.trim().replace(/\/+$/,'');if(!/^https:\/\/[^/]+/i.test(v)){toast('HTTPS Render URL डालें');return}localStorage.setItem('earnova_admin_api',v);location.reload()};
  window.changeApi=()=>{$('setup').classList.remove('hidden');$('apiBaseInput').value=API_BASE};
  async function api(path,method='GET',data=null){
    if(!API_BASE) throw new Error('Render backend URL सेट करें');
    const opts={method,headers:{'Content-Type':'application/json','X-Telegram-Init-Data':initData}};
    if(data) opts.body=JSON.stringify({...data,initData});
    const res=await fetch(API_BASE+path,opts);
    let out={};try{out=await res.json()}catch{}
    if(!res.ok||out.ok===false) throw new Error(out.error||('Request failed: '+res.status));
    return out;
  }
  function card(title,value){return `<div class="stat"><small>${esc(title)}</small><strong>${esc(value??0)}</strong></div>`}
  function money(v){return '₹'+Number(v||0).toFixed(2)}
  function pill(s){return `<span class="pill ${esc(s)}">${esc(s||'unknown')}</span>`}
  function list(items,empty='कोई रिकॉर्ड नहीं मिला'){return items?.length?`<div class="stack">${items.map(x=>x).join('')}</div>`:`<div class="empty">${empty}</div>`}
  function setTab(tab){current=tab;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab))}
  window.loadSection=async(tab)=>{setTab(tab);$('content').innerHTML='<div class="empty">Loading…</div>';try{
    if(tab==='dashboard') await dashboard();
    if(tab==='withdrawals') await withdrawals();
    if(tab==='users') await users();
    if(tab==='tasks') await tasks();
    if(tab==='submissions') await submissions();
    if(tab==='bonuses') await bonuses();
    if(tab==='referrals') await referrals();
  }catch(e){$('content').innerHTML=`<div class="notice danger-text">${esc(e.message)}</div>`}};
  async function dashboard(){
    const d=await api('/api/admin/dashboard','POST');
    $('content').innerHTML=`<h2 class="section-title">Platform Overview</h2><div class="grid">
      ${card('Registered Users',d.total_users)}${card('Total User Balance',money(d.total_balance))}
      ${card('Pending Withdrawals',d.pending_withdrawals)}${card('Total Withdrawals',d.total_withdrawals)}
      ${card('Pending Tasks',d.pending_tasks)}${card('Completed Tasks',d.completed_tasks)}
      ${card('Total Referrals',d.total_referrals)}${card('Ad Rewards',money(d.ad_rewards))}
    </div><p class="muted small">आँकड़े backend database से प्राप्त होते हैं।</p>`;
  }
  let withdrawalRows=[];
  async function withdrawals(){
    const d=await api('/api/admin/withdrawals','POST',{status:'all'});
    withdrawalRows=d.withdrawals||[];
    const counts={pending:0,approved:0,rejected:0};
    withdrawalRows.forEach(w=>{const s=String(w.status||'').toLowerCase();if(counts[s]!==undefined)counts[s]++;});
    $('content').innerHTML=`<div class="row"><div><h2 class="section-title">Withdrawal Management</h2><p class="muted small">सभी रिक्वेस्ट, UPI विवरण और भुगतान का रिकॉर्ड</p></div><span class="pill">${withdrawalRows.length} records</span></div>
      <div class="withdrawal-summary"><div class="withdrawal-stat"><small>Pending</small><strong style="color:#f2bd55">${counts.pending}</strong></div><div class="withdrawal-stat"><small>Approved</small><strong style="color:#25c58a">${counts.approved}</strong></div><div class="withdrawal-stat"><small>Rejected</small><strong style="color:#f16b75">${counts.rejected}</strong></div></div>
      <div class="withdrawal-tools"><input id="withdrawalSearch" placeholder="Request ID, User ID या UPI से खोजें" oninput="filterWithdrawals()"><select id="withdrawalFilter" onchange="filterWithdrawals()"><option value="all">All Requests</option><option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select></div>
      <p class="timezone-note">सभी तारीखें और समय भारतीय समय (IST · Asia/Kolkata) में दिखाए जाते हैं।</p><div id="withdrawalList"></div>`;
    window.filterWithdrawals();
  }
  window.filterWithdrawals=()=>{
    const q=($('withdrawalSearch')?.value||'').trim().toLowerCase();
    const filter=$('withdrawalFilter')?.value||'all';
    const rows=withdrawalRows.filter(w=>{const status=String(w.status||'').toLowerCase();const hay=[w.id,w.telegram_id,w.upi_id,w.amount].join(' ').toLowerCase();return (filter==='all'||status===filter)&&(!q||hay.includes(q));});
    $('withdrawalList').innerHTML=list(rows.map(w=>{
      const date=formatIndiaDate(w.created_at);const time=formatIndiaTime(w.created_at);
      return `<article class="withdrawal-card"><div class="withdrawal-top"><div><div class="withdrawal-id">WITHDRAWAL REQUEST #${esc(w.id)}</div><div class="withdrawal-amount">${money(w.amount)}</div></div>${pill(String(w.status||'unknown').toLowerCase())}</div>
        <div class="withdrawal-details"><div class="withdrawal-field"><small>USER TELEGRAM ID</small><strong>${esc(w.telegram_id)}</strong></div>
        <div class="withdrawal-field"><small>WITHDRAWAL AMOUNT</small><strong>${money(w.amount)}</strong></div>
        <div class="withdrawal-field full"><small>USER UPI ID</small><div class="upi-line"><strong>${esc(w.upi_id||'Not provided')}</strong>${w.upi_id?`<button class="copy-upi" onclick="copyWithdrawalUpi('${esc(w.upi_id)}')">Copy UPI</button>`:''}</div></div>
        <div class="withdrawal-field"><small>REQUEST DATE</small><strong>${esc(date)}</strong></div><div class="withdrawal-field"><small>REQUEST TIME</small><strong>${esc(time)}</strong></div>
        ${w.rejection_reason?`<div class="withdrawal-field full"><small>REJECTION REASON</small><strong class="danger-text">${esc(w.rejection_reason)}</strong></div>`:''}</div>
        <div class="withdrawal-foot"><span class="muted small">Time zone: IST (UTC+05:30)</span><div class="actions" style="margin:0">${String(w.status).toLowerCase()==='pending'?`<button class="good" onclick="reviewWithdrawal(${Number(w.id)},'approve')">Approve Paid</button><button class="danger" onclick="reviewWithdrawal(${Number(w.id)},'reject')">Reject & Refund</button>`:''}</div></div></article>`;
    }), 'कोई Withdrawal Request नहीं मिली');
  };
  window.copyWithdrawalUpi=async(value)=>{try{await navigator.clipboard.writeText(value);toast('UPI ID copied')}catch(e){toast('UPI ID: '+value)}};
  window.reviewWithdrawal=async(id,action)=>{let reason='';if(action==='reject'){reason=prompt('Rejection reason लिखें:');if(reason===null)return;if(!reason.trim()){toast('Reason जरूरी है');return} }if(action==='approve'&&!confirm('क्या आपने UPI payment वास्तव में कर दिया है?'))return;if(action==='reject'&&!confirm('Request reject करके balance refund करना है?'))return;try{await api('/api/admin/withdrawals/review','POST',{withdrawal_id:id,action,reason});toast('Request updated');withdrawals()}catch(e){toast(e.message)}};
  async function users(){
    $('content').innerHTML=`<div class="row"><div><h2 class="section-title">User Management</h2><p class="muted small">User profile, verified earnings, tasks, referrals और account activity</p></div><span class="pill">Admin view</span></div>
      <div class="user-search"><input id="userQuery" placeholder="Telegram ID, username या नाम से खोजें"><button class="primary" onclick="searchUsers()">Search</button></div>
      <div id="userResults" class="user-results"></div><div id="userDetail"></div>`;
    await searchUsers();
  }
  window.searchUsers=async()=>{
    try{
      const q=$('userQuery')?.value||'';
      const d=await api('/api/admin/users','POST',{q});
      $('userResults').innerHTML=(d.users||[]).length?(d.users||[]).map(u=>`<article class="user-result"><div><strong>${esc([u.first_name,u.last_name].filter(Boolean).join(' ')||u.username||'EARNOVA User')}</strong><small>@${esc(u.username||'—')} · ID: ${esc(u.telegram_id)} · Balance: ${money(u.balance)}</small><small>Joined: ${esc(formatIndiaDateTime(u.created_at))}</small></div><button class="primary" onclick="viewUser(${Number(u.telegram_id)})">View Details</button></article>`).join(''):'<div class="empty">कोई User नहीं मिला</div>';
      $('userDetail').innerHTML='';
    }catch(e){$('userResults').innerHTML=`<p class="danger-text">${esc(e.message)}</p>`}
  };
  window.viewUser=async(id)=>{
    const target=$('userDetail');target.innerHTML='<div class="empty">Loading verified user records…</div>';
    try{
      const d=await api('/api/admin/user-detail','POST',{telegram_id:id});
      const u=d.user||{}, s=d.summary||{}, events=d.activity||[];
      const fullName=[u.first_name,u.last_name].filter(Boolean).join(' ')||u.username||'EARNOVA User';
      const history=(items,render,empty)=>items?.length?items.map(render).join(''):`<div class="empty">${empty}</div>`;
      target.innerHTML=`
        <div class="user-section-head"><h3>User Profile &amp; Audit</h3><button onclick="viewUser(${Number(id)})">↻ Refresh</button></div>
        <section class="user-hero"><div class="user-hero-top"><div><div class="user-name">${esc(fullName)}</div><div class="user-handle">@${esc(u.username||'no_username')} · <span class="pill">Registered User</span></div></div><span class="pill approved">Database record found</span></div>
          <div class="user-meta"><div><small>TELEGRAM ID</small><strong>${esc(u.telegram_id)}</strong></div><div><small>JOINED (IST)</small><strong>${esc(formatIndiaDateTime(u.created_at))}</strong></div><div><small>CURRENT BALANCE</small><strong>${money(u.balance)}</strong></div></div></section>
        <div class="user-stats">
          <div class="user-stat"><small>Total Earned*</small><strong>${money(s.total_earned)}</strong></div>
          <div class="user-stat"><small>Completed Tasks</small><strong>${esc(s.completed_tasks||0)}</strong></div>
          <div class="user-stat"><small>Referrals</small><strong>${esc(s.referrals||0)}</strong></div>
          <div class="user-stat"><small>Withdrawn (Approved)</small><strong>${money(s.withdrawn)}</strong></div>
        </div>
        <div class="user-panels">
          <section class="user-panel"><h3>📊 Verified Wallet Activity</h3>
            ${history(events.slice(0,8),e=>`<div class="user-activity"><span>${esc(e.label)}</span><time>${esc(formatIndiaDateTime(e.created_at))}</time><b class="${Number(e.amount)>=0?'user-positive':''}">${money(e.amount)}</b></div>`,'अभी कोई earning activity नहीं है')}
            <p class="muted small">*Total Earned = completed positive wallet ledger entries; pending/rejected entries शामिल नहीं हैं।</p>
          </section>
          <section class="user-panel user-risk"><h3>🛡️ Account Review</h3>
            <div class="user-activity"><span>Completed task records</span><b>${esc(s.completed_tasks||0)}</b></div>
            <div class="user-activity"><span>Rejected task records</span><b>${esc(s.rejected_tasks||0)}</b></div>
            <div class="user-activity"><span>Pending task records</span><b>${esc(s.pending_tasks||0)}</b></div>
            <p class="muted small">यह रिकॉर्ड-आधारित समीक्षा है। Device/IP data उपलब्ध नहीं है, इसलिए इसे automatic fraud verdict न समझें।</p>
          </section>
        </div>
        <div class="user-section-head"><h3>Task History</h3><span class="pill">${(d.tasks||[]).length} records</span></div>
        <div class="user-history">${history(d.tasks,t=>`<article class="user-history-row"><div><b>${esc(t.title||('Task #'+t.task_id))}</b><p>Task #${esc(t.task_id)} · ${esc(formatIndiaDateTime(t.created_at))}</p></div><div>${pill(t.status)}<p>${money(t.reward)}</p></div></article>`,'कोई Task History नहीं मिली')}</div>
        <div class="user-section-head"><h3>Referral History</h3><span class="pill">${(d.referrals||[]).length} records</span></div>
        <div class="user-history">${history(d.referrals,r=>`<article class="user-history-row"><div><b>${r.role==='referrer'?'Referred User':'Referred By'}</b><p>Telegram ID: ${esc(r.other_user_id)} · ${esc(formatIndiaDateTime(r.created_at))}</p></div><div>${pill(r.status)}</div></article>`,'कोई Referral Record नहीं मिला')}</div>
        <div class="user-section-head"><h3>Withdrawal History</h3><span class="pill">${(d.withdrawals||[]).length} records</span></div>
        <div class="user-history">${history(d.withdrawals,w=>`<article class="user-history-row"><div><b>Withdrawal #${esc(w.id)}</b><p>${esc(formatIndiaDateTime(w.created_at))} · ${esc(w.upi_id||'UPI unavailable')}</p></div><div>${pill(w.status)}<p>${money(w.amount)}</p></div></article>`,'कोई Withdrawal Record नहीं मिला')}</div>
        <div class="user-section-head"><h3>Wallet Transactions</h3><span class="pill">${(d.transactions||[]).length} records</span></div>
        <div class="user-history">${history(d.transactions,t=>`<article class="user-history-row"><div><b>${esc(t.transaction_type)}</b><p>${esc(formatIndiaDateTime(t.created_at))} · Ref #${esc(t.id)}</p></div><div>${pill(t.status)}<p>${money(t.amount)}</p></div></article>`,'कोई Wallet Transaction नहीं मिला')}</div>`;
      target.scrollIntoView({behavior:'smooth',block:'start'});
    }catch(e){target.innerHTML=`<div class="notice danger-text">${esc(e.message)}</div>`}
  };
  window.userTransactions=async(id)=>viewUser(id);
  async function tasks(){
    const d=await api('/api/admin/tasks','POST',{});
    $('content').innerHTML=`<h2 class="section-title">Create / Manage Tasks</h2><div class="card"><div class="form-grid">
      <div><label>Title</label><input id="taskTitle"></div><div><label>Reward (₹)</label><input id="taskReward" type="number" min="0.01" step="0.01"></div>
      <div><label>Task Type</label><input id="taskType" value="custom"></div><div><label>Verification</label><select id="taskVerification"><option value="manual">Manual review</option><option value="automatic">Automatic (only if genuinely verifiable)</option></select></div>
      <div><label>Target URL</label><input id="taskUrl" type="url"></div><div><label>Description</label><textarea id="taskDesc"></textarea></div></div><div class="form-actions"><button class="primary" onclick="saveTask()">Create Task</button></div></div>
      <h3 class="section-title">Existing Tasks</h3>${list((d.tasks||[]).map(t=>`<article class="item"><div class="row"><h3>#${esc(t.id)} · ${esc(t.title)}</h3>${pill(t.active?'active':'inactive')}</div><p>${money(t.reward)} · ${esc(t.verification)} · ${esc(t.target_url||'')}</p><div class="actions"><button onclick="toggleTask(${Number(t.id)},${!t.active})">${t.active?'Deactivate':'Activate'}</button><button class="danger" onclick="deleteTask(${Number(t.id)})">Delete</button></div></article>`))}`;
  }
  window.saveTask=async()=>{try{await api('/api/admin/tasks/create','POST',{title:$('taskTitle').value,description:$('taskDesc').value,reward:$('taskReward').value,task_type:$('taskType').value,verification:$('taskVerification').value,target_url:$('taskUrl').value});toast('Task created');tasks()}catch(e){toast(e.message)}};
  window.toggleTask=async(id,active)=>{try{await api('/api/admin/tasks/update','POST',{task_id:id,active});toast('Task updated');tasks()}catch(e){toast(e.message)}};
  window.deleteTask=async(id)=>{if(!confirm('Task deactivate करना है?'))return;try{await api('/api/admin/tasks/update','POST',{task_id:id,active:false});toast('Task deactivated');tasks()}catch(e){toast(e.message)}};
  async function submissions(){
    const d=await api('/api/admin/task-submissions','POST',{status:'pending'});
    $('content').innerHTML=`<h2 class="section-title">Pending Task Submissions</h2>${list((d.submissions||[]).map(s=>`<article class="item"><h3>Task #${esc(s.task_id)} · ${esc(s.title||'')}</h3><p>User: ${esc(s.telegram_id)} · Reward: ${money(s.reward)}</p><p>Submitted: ${esc(formatIndiaDateTime(s.created_at))}</p><div class="actions"><button class="good" onclick="reviewTask(${Number(s.id)},'approve')">Approve</button><button class="danger" onclick="reviewTask(${Number(s.id)},'reject')">Reject</button></div></article>`))}`;
  }
  window.reviewTask=async(id,action)=>{let reason='';if(action==='reject'){reason=prompt('Reject करने का कारण:');if(reason===null)return}try{await api('/api/admin/task-submissions/review','POST',{submission_id:id,action,reason});toast('Submission reviewed');submissions()}catch(e){toast(e.message)}};
  function formatIndiaDateTime(value){if(!value)return '—';const d=new Date(value);return Number.isNaN(d.getTime())?String(value):new Intl.DateTimeFormat('en-IN',{timeZone:'Asia/Kolkata',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true}).format(d)+' IST';}
  function formatIndiaDate(value){if(!value)return '—';const d=new Date(value);return Number.isNaN(d.getTime())?String(value):new Intl.DateTimeFormat('en-IN',{timeZone:'Asia/Kolkata',day:'2-digit',month:'short',year:'numeric'}).format(d);}
  function formatIndiaTime(value){if(!value)return '—';const d=new Date(value);return Number.isNaN(d.getTime())?String(value):new Intl.DateTimeFormat('en-IN',{timeZone:'Asia/Kolkata',hour:'2-digit',minute:'2-digit',hour12:true}).format(d)+' IST';}
  function formatLocalDateTime(value){return formatIndiaDateTime(value);}
  async function bonuses(){
    const d=await api('/api/admin/bonus-codes','POST',{});
    $('content').innerHTML=`<h2 class="section-title">Create Bonus Code</h2><div class="card"><div class="form-grid"><div><label>Code</label><input id="bonusCode"></div><div><label>Reward (₹)</label><input id="bonusReward" type="number" step="0.01" min="0.01"></div><div><label>Max Claims</label><input id="bonusMax" type="number" min="1" value="100"></div><div><label>Release Date &amp; Time (IST)</label><input id="bonusRelease" type="datetime-local"></div><div><label>Expiry Date &amp; Time (IST)</label><input id="bonusExpiry" type="datetime-local"></div></div><div class="form-actions"><button class="primary" onclick="createBonus()">Create Code</button></div></div><h3 class="section-title">Bonus Codes</h3>${list((d.codes||[]).map(c=>`<article class="item"><div class="row"><h3>${esc(c.code)}</h3>${pill(c.active?'active':'inactive')}</div><p>Reward ${money(c.reward)} · Claims ${esc(c.claims)}/${esc(c.max_claims)}</p><p>Release: ${esc(formatLocalDateTime(c.release_at))} · Expiry: ${esc(formatLocalDateTime(c.expires_at))}</p><button onclick="toggleBonus(${Number(c.id)},${!c.active})">${c.active?'Deactivate':'Activate'}</button></article>`))}`;
  }
  window.createBonus=async()=>{try{await api('/api/admin/bonus-codes/create','POST',{code:$('bonusCode').value,reward:$('bonusReward').value,max_claims:$('bonusMax').value,release_at:$('bonusRelease').value?new Date($('bonusRelease').value+'+05:30').toISOString():null,expires_at:$('bonusExpiry').value?new Date($('bonusExpiry').value+'+05:30').toISOString():null});toast('Bonus code created');bonuses()}catch(e){toast(e.message)}};
  window.toggleBonus=async(id,active)=>{try{await api('/api/admin/bonus-codes/update','POST',{bonus_id:id,active});toast('Updated');bonuses()}catch(e){toast(e.message)}};
  async function referrals(){
    const d=await api('/api/admin/referrals','POST',{status:'all'});
    $('content').innerHTML=`<h2 class="section-title">Referral Review</h2>${list((d.referrals||[]).map(r=>`<article class="item"><div class="row"><h3>Referral #${esc(r.id)}</h3>${pill(r.status)}</div><p>Referrer: ${esc(r.referrer_id)} · Referred user: ${esc(r.referred_id)}</p><p>${esc(formatIndiaDateTime(r.created_at))}</p><div class="actions">${r.status==='pending'?`<button class="good" onclick="reviewReferral(${Number(r.id)},'approve')">Approve</button><button class="danger" onclick="reviewReferral(${Number(r.id)},'reject')">Reject</button>`:''}</div></article>`))}`;
  }
  window.reviewReferral=async(id,action)=>{if(!confirm(`Referral ${action} करना है?`))return;try{await api('/api/admin/referrals/review','POST',{referral_id:id,action});toast('Referral updated');referrals()}catch(e){toast(e.message)}};
  async function boot(){
    if(!initData){status('इसे Telegram के EARNOVA Mini App के अंदर खोलें। सीधे browser से admin login नहीं होगा।',true);return}
    let tgUser;try{tgUser=JSON.parse(new URLSearchParams(initData).get('user')||'{}')}catch{}
    if(Number(tgUser?.id)!==ADMIN_ID){status('Access denied: यह Telegram account Admin नहीं है।',true);return}
    $('adminIdentity').textContent='Admin ID: '+ADMIN_ID;
    try{await api('/api/admin/dashboard','POST');status('Admin identity और backend access verified.');$('app').classList.remove('hidden');await loadSection('dashboard')}
    catch(e){status('Backend verification failed: '+e.message,true);if(/Failed to fetch|NetworkError/i.test(e.message))changeApi()}
  }
  boot();
})();
</script>
</body>
</html>
